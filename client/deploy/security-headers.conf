# Security headers for every page and asset nginx serves. Phase 15.
#
# ONE FILE, INCLUDED IN EVERY LOCATION THAT SERVES THE APP. nginx does not merge
# add_header: a location with any add_header of its own inherits NONE from the
# server block. Written once at server level, these headers would silently
# vanish from index.html and the hashed assets -- the two locations that set
# Cache-Control. And a location with none of its own inherits ALL of them, so at
# server level they would also land on /api/, doubling helmet's. Hence: per
# location, and never on /api/. client/src/test/deployConfig.test.js checks both.
#
# CONTENT SECURITY POLICY (deferred from Phase 12). The built client loads
# nothing from anywhere else -- no fonts, no CDN, no analytics -- so everything
# is 'self', with no 'unsafe-inline' and no 'unsafe-eval':
#   img-src data:    Bootstrap draws form controls from inline SVG data URLs.
#   connect-src      fetch and the streamed turns go to /api on this origin.
#   frame-ancestors  'none': the confirmation dialog must not be framed and
#                    clicked through from another site (ADR 0009).
# Checked in a browser against the production build (Phase 15 §5).
#
# HSTS is not set here: nginx serves plain HTTP inside the deployment, and the
# header belongs to whatever terminates TLS in front of it (DEPLOYMENT.md).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
