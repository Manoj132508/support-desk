# nginx for the client container. Ported from Project 2 (ai-career-platform),
# with the security headers Phase 12 deferred and the API's port.
#
# Two jobs: serve the built app, and proxy /api to Express so the browser talks
# to ONE origin -- which the httpOnly, SameSite=Strict session cookie needs.
#
# This is the ONLY published port in the deployment. The API trusts exactly one
# proxy hop for the client address (TRUST_PROXY_HOPS=1), and this is that hop:
# reached any other way, a caller's forged X-Forwarded-For would be believed
# (server/test/trustProxy.test.js).

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The API refuses bodies over 64 KB; refuse them here without a round trip.
    client_max_body_size 64k;

    # Security headers are included PER LOCATION, never here. At server level
    # they would be inherited by /api/, which sets no headers of its own, and
    # every API response would carry them twice (helmet sends its own).
    # security-headers.conf explains the opposite trap.

    # Compression at the edge, for static files only -- never for the streamed
    # /api responses below, where it would hold tokens back.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable: the name changes when the content does.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached: it names the current hashed bundles, and a
    # cached copy after a deploy points at files that no longer exist. Every
    # client route lands here too, through the fallback below.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the address nginx saw to anything the client sent. The API
        # reads only that last entry (one trusted hop), so a forged header
        # changes nothing.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STREAMING TURNS. Buffering would deliver a whole answer at once at the
        # end; the API also sends X-Accel-Buffering: no. The read timeout covers
        # a slow model between tokens.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Nothing hidden (.git, .env) is ever served, even if one reached the image.
    location ~ /\. {
        deny all;
    }

    # Client routes such as /console/tickets/abc are not files: serve the app
    # and let the router resolve them. A missing asset still 404s above.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
