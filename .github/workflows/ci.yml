name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repo went public at Phase 1 specifically so this runs DURING the build
# rather than after it. Projects 1 and 2 were pushed only at the end, which
# meant CI never ran while the code was being written and the first push was a
# leap of faith.
jobs:
  client:
    name: Client — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock disagree, so CI cannot silently test
      # a different dependency tree from the one committed.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  server:
    name: Server — contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      # Tests bind to port 0, so nothing here depends on a fixed port being
      # free and the two jobs cannot collide.
      - name: Test
        run: npm test

  ai-service:
    name: AI service — pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-test.txt

      # requirements-TEST, not requirements. The full runtime pulls torch and
      # transformers -- about two gigabytes and several minutes -- and nothing
      # in the suite needs a model: retrieval takes an Embedder protocol and
      # generation takes a Generator protocol, so the tests inject fakes and
      # assert on the DECISIONS and the PROMPT, which is where the logic lives.
      # The heavy imports are lazy, inside constructors, so importing any
      # module here costs nothing.
      #
      # The trade, stated plainly: CI proves the pipeline's logic in seconds.
      # It does not prove that a real model embeds these documents usefully.
      # That is an integration concern, measured by the eval in Phase 13.
      - name: Install
        run: pip install -r requirements-test.txt

      - name: Test
        run: python -m pytest -q
