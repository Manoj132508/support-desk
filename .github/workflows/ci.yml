name: CI

on:
  push:
    branches: [main]
  pull_request:

# The repo went public at Phase 1 specifically so this runs DURING the build
# rather than after it. Projects 1 and 2 were pushed only at the end, which
# meant CI never ran while the code was being written and the first push was a
# leap of faith.
jobs:
  client:
    name: Client — tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lock disagree, so CI cannot silently test
      # a different dependency tree from the one committed.
      - name: Install
        run: npm ci

      # The github-actions reporter also writes each failure as an annotation:
      # a job's log needs a signed-in viewer, and annotations do not.
      - name: Test
        run: npx vitest run --reporter=default --reporter=github-actions

      - name: Build
        run: npm run build

  server:
    name: Server — contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      # Tests bind to port 0, so nothing here depends on a fixed port being
      # free and the two jobs cannot collide.
      #
      # `test:ci` adds a reporter that writes each failure as an annotation
      # (test/support/githubAnnotations.mjs). This job's first failure, in
      # Phase 15, could not be read without signing in: logs need a session,
      # annotations do not. The AI service's conftest.py does the same for pytest.
      - name: Test
        run: npm run test:ci

      # INV-A's evidence, on every push (Phase 1 §6). Fails the build if a
      # single golden-set case is decided more permissively than specified, or
      # if more than one legitimate case in ten is sent to a person. Its own
      # step rather than part of `npm test`, so the report is visible on its
      # own in the run log.
      - name: Policy eval (gates)
        run: npm run eval:policy -- --check

  ai-service:
    name: AI service — pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-test.txt

      # requirements-TEST, not requirements. The full runtime pulls torch and
      # transformers -- about two gigabytes and several minutes -- and nothing
      # in the suite needs a model: retrieval takes an Embedder protocol and
      # generation takes a Generator protocol, so the tests inject fakes and
      # assert on the DECISIONS and the PROMPT, which is where the logic lives.
      # The heavy imports are lazy, inside constructors, so importing any
      # module here costs nothing.
      #
      # The trade, stated plainly: CI proves the pipeline's logic in seconds.
      # It does not prove that a real model embeds these documents usefully.
      # That is an integration concern, measured by the eval in Phase 13.
      - name: Install
        run: pip install -r requirements-test.txt

      - name: Test
        run: python -m pytest -q
