[pytest]
testpaths = tests
pythonpath = .

# Two deprecation warnings raised INSIDE the FastAPI and Starlette test client,
# not by this service: Starlette now wants httpx2 rather than httpx, and it uses
# an anyio alias that anyio has deprecated.
#
# Filtered by their exact messages rather than silenced wholesale. The point is
# that a NEW warning -- above all one from this code -- still shows up, instead
# of sitting among two familiar ones everyone has learned to scroll past. A
# warning list that always says something teaches people to stop reading it.
#
# Revisit on the next FastAPI or Starlette upgrade, which is what will actually
# remove them.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
